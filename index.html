<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Chauffeurs — Arriving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#dfc476}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#080706;color:#fff;font:400 1rem "Space Grotesk",Arial,sans-serif}
.stage,.shade{position:fixed;inset:0;pointer-events:none}
.stage{background:radial-gradient(ellipse at 45% 50%,#302619,#080706 74%)}
.stage img,.stage video{position:absolute;width:100%;height:100%;object-fit:cover}
.stage video{visibility:hidden}
.stage video.playing{visibility:visible}
.shade{background:radial-gradient(ellipse at center,rgba(7,6,4,.68),rgba(7,6,4,.77) 68%,rgba(7,6,4,.94));box-shadow:inset 0 0 0 1px #dbbc642b}
main{position:relative;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:2rem max(1rem,env(safe-area-inset-right))}
.panel{display:grid;justify-items:center;gap:1rem;text-align:center;max-width:36rem}
.logo{display:block;width:clamp(5.5rem,16vw,9rem);height:auto;aspect-ratio:1;object-fit:contain;color:var(--gold)}
h1{margin:0;letter-spacing:.2em;text-indent:.2em;font-size:clamp(1.15rem,5vw,2.1rem);line-height:1.2}
h1 span{color:var(--gold)}
p{margin:0;color:#e3d8c3;letter-spacing:.13em;text-transform:uppercase;font-size:.78rem}
.rule{width:7rem;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.75rem;margin-top:1rem}
a,button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:.65rem 1.1rem;color:#fff;background:#14100cee;border:1px solid #7f6e43;text-decoration:none;font:700 .77rem "Space Grotesk",Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}
a[aria-label="Enter site"]{background:var(--gold);color:#151008;border-color:var(--gold)}
:is(a,button):hover{border-color:#fff}
:is(a,button):focus-visible{outline:2px solid #fff;outline-offset:4px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <img alt="" src="https://cdn.higgsfield.ai/user_3ECGVFZTaGiKHb6MBbVpPbvllLv/hf_20260713_224830_bd35d856-b927-4f15-af46-5536f3fc4a22_thumbnail.webp">
  <video id="intro" muted playsinline preload="none" data-src="https://d8j0ntlcm91z4.cloudfront.net/user_3ECGVFZTaGiKHb6MBbVpPbvllLv/hf_20260713_224830_bd35d856-b927-4f15-af46-5536f3fc4a22.mp4"></video>
</div>
<div class="shade" aria-hidden="true"></div>
<main>
  <div class="panel">
    <img alt="" width="144" height="144" class="logo" src="https://d8j0ntlcm91z4.cloudfront.net/user_3ECGVFZTaGiKHb6MBbVpPbvllLv/hf_20260701_084615_43cb1099-fb41-4d47-baee-e11e688d5c4b.png">
    <h1>The <span>Chauffeurs</span></h1>
    <p>Luxury Transportation · Las Vegas</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="actions">
      <a href="home.html" aria-label="Enter site">Enter Site</a>
      <a href="home.html">Skip Intro</a>
    </div>
    <div class="controls" id="controls" hidden>
      <button id="play" type="button">Play intro</button>
      <button id="sound" type="button" hidden>Unmute intro</button>
    </div>
  </div>
</main>
<script>
(() => {
  const video = document.querySelector('#intro');
  const controls = document.querySelector('#controls');
  const play = document.querySelector('#play');
  const sound = document.querySelector('#sound');
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const connection = navigator.connection;
  let started = false;
  function stop() {
    video.pause();
    video.muted = true;
    video.classList.remove('playing');
    play.textContent = 'Play intro';
    sound.hidden = true;
    sound.textContent = 'Unmute intro';
  }
  async function start() {
    if (!started) {
      video.src = video.dataset.src;
      started = true;
    }
    try {
      await video.play();
    } catch {
      stop();
    }
  }
  controls.hidden = false;
  video.addEventListener('playing', () => {
    if (document.hidden) { stop(); return; }
    video.classList.add('playing');
    play.textContent = 'Pause intro';
    sound.hidden = false;
  });
  video.addEventListener('ended', stop);
  video.addEventListener('error', () => { stop(); started = false; });
  play.addEventListener('click', () => {
    if (!video.paused) { stop(); return; }
    start();
  });
  sound.addEventListener('click', () => {
    video.muted = !video.muted;
    sound.textContent = video.muted ? 'Unmute intro' : 'Mute intro';
  });
  motion.addEventListener?.('change', (event) => { if (event.matches) stop(); });
  document.addEventListener('visibilitychange', () => { if(document.hidden) stop(); });
  addEventListener('pagehide', stop);
  if (!motion.matches && !connection?.saveData && !document.hidden) start();
})();
</script>
</body>
</html>
